version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: attentioncraft_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/weights:/app/backend/weights
      - ./public:/app/public
      - ./downloads:/app/downloads
    environment:
      - GGUF_PATH=/app/downloads/Wan2.1-T2V-1.3B-Q4_K_M.gguf
      - VAE_PATH=/app/downloads/wan_2.1_vae.safetensors
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: attentioncraft_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
